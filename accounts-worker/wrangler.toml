name = "gradedcards01-accounts"
main = "worker.js"
compatibility_date = "2024-09-01"

# Plain (non-secret) variables must live here: every git-triggered deploy
# replaces the Worker's vars with this list, so one set only in the
# dashboard gets wiped on the next push. Secrets (RESEND_API_KEY,
# STRIPE_*, ADMIN_KEY) are unaffected and stay dashboard-only.
[vars]
EMAIL_FROM = "Graded Cards 01 <orders@gradedcards01.com>"

# Fill in database_id after running:
#   npx wrangler d1 create gradedcards01-accounts
# (see ../ACCOUNTS-SETUP.md)
[[d1_databases]]
binding = "DB"
database_name = "gradedcards01-accounts"
database_id = "4e6c956f-da1f-4577-844d-e32d72b59d37"
