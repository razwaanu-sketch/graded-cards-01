name: Card share pages

# Rebuilds every generated page (card pages, category landing pages, the set
# guide, sitemap.xml, the Google Merchant feed, home/footer "shop by" links)
# whenever the card list, a template, a card photo or the SEO data changes,
# then runs the SEO audit and shows its summary on the run page.
on:
  push:
    branches: [main]
    paths:
      - products.js
      - product.html
      - about.html
      - index.html
      - images/cards/**
      - images/logo-mark.png
      - seo/sets.json
      - seo/categories.json
      - seo/keywords.json
      - tools/**
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: card-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Build pages
        run: python3 tools/build_card_pages.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: SEO audit
        run: |
          python3 tools/seo_audit.py
          cat seo/audit-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changes
        id: commit
        run: |
          git add -A -- '*.html' card-pages.js images/share sitemap.xml google-merchant-feed.xml seo/audit-report.md
          if git diff --cached --quiet; then
            echo "No generated changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild generated pages"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made by this workflow don't start a Pages build on their own.
      - name: Publish the site
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
